name: faq-help-center-insw

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faq_help_center_insw}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faq_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-faq_help_center_insw}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    build:
      context: ./server
    command: ["npm", "run", "db:push"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-faq_dev_password}@postgres:5432/${POSTGRES_DB:-faq_help_center_insw}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-faq_dev_password}@postgres:5432/${POSTGRES_DB:-faq_help_center_insw}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      SUPABASE_GUIDES_BUCKET: ${SUPABASE_GUIDES_BUCKET:-guides}
      SUPABASE_ICONS_BUCKET: ${SUPABASE_ICONS_BUCKET:-help-center-icons}
    ports:
      - "${API_PORT:-5001}:5001"
    volumes:
      - guide_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:5001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  cms:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001/api}
    restart: unless-stopped
    ports:
      - "${CMS_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  guide_uploads: